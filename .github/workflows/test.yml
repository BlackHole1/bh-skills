# Cross-platform test suite for the skill helper scripts. The scripts are
# stdlib-only Python, so the job is deliberately thin: checkout, a Python
# toolchain, pytest. The three-OS matrix is the point — the scripts must behave
# identically on the user machines the skills get installed on.
name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 3.9 is the floor the scripts target; 3.x is the current release.
        python-version: ["3.9", "3.x"]
        exclude:
          # macos-latest runs on ARM, where setup-python's 3.9 builds are
          # unreliable; the 3.9 floor is still covered on the other two OSes.
          - os: macos-latest
            python-version: "3.9"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The job runs PR code under pytest; nothing here pushes, so the
          # token must not sit in .git/config where that code could read it.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run tests
        run: python -m pytest -q
